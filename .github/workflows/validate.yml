name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install riso
        run: cargo install --git https://github.com/eldios/riso riso-cli
      - name: validate every theme in the index
        run: |
          set -euo pipefail
          fail=0
          while IFS=$'\t' read -r name repo rev; do
            dir=$(mktemp -d)
            if [ -n "$rev" ] && [ "$rev" != "null" ]; then
              git clone --quiet "$repo" "$dir" && git -C "$dir" checkout --quiet "$rev"
            else
              git clone --quiet --depth 1 "$repo" "$dir"
            fi
            echo "== $name"
            riso theme validate "$dir" || fail=1
          done < <(jq -r '.themes[] | [.name, .repo, (.rev // "")] | @tsv' index.json)
          exit "$fail"
